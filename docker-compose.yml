services:
  backend:
    build:
      context: ./backend
    container_name: ai-visibility-backend
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PERPLEXITY_API_KEY: ${PERPLEXITY_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      PERPLEXITY_MODEL: ${PERPLEXITY_MODEL:-sonar}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-3-5-haiku-20241022}
      WRITER_PROVIDER: ${WRITER_PROVIDER:-openai}
      WRITER_MODEL: ${WRITER_MODEL:-gpt-4o-mini}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: ai-visibility-frontend
    depends_on:
      - backend
    ports:
      - "5173:4173"
    environment:
      VITE_BACKEND_URL: http://backend:8000
    restart: unless-stopped
